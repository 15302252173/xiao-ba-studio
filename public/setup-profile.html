<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>设置 GitHub 主页</title><style>
body{font-family:system-ui,sans-serif;max-width:500px;margin:60px auto;padding:20px;background:#0d1117;color:#c9d1d9}
h1{color:#58a6ff}.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px;margin:16px 0}
button{background:#238636;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:14px;width:100%;margin:4px 0}
button:hover{background:#2ea043}
.hint{color:#8b949e;font-size:13px}
a{color:#58a6ff}
</style></head><body>
<h1>🎨 GitHub 主页装修</h1>

<div class="card">
  <h3>1. 创建个人 README 仓库</h3>
  <p class="hint">仓库名必须和用户名一样 (15302252173)，GitHub 会自动把它显示在主页上。</p>
  <button onclick="window.open('https://github.com/new?name=15302252173&description=我的个人主页&auto_init=true','_blank')">📝 创建 15302252173 仓库</button>
</div>

<div class="card">
  <h3>2. 钉选仓库到主页</h3>
  <p class="hint">去你的 GitHub 主页，点击「Customize your pins」钉选这两个仓库。</p>
  <button onclick="window.open('https://github.com/15302252173','_blank')">🏠 打开 GitHub 主页</button>
</div>
</body></html>
